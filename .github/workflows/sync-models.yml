# =============================================================================
# Sync Kera2 models to HuggingFace
# Downloads models from original sources and uploads to manyuanrong/kera2-models
#
# Trigger: manually via Actions tab → "Run workflow"
# Secrets required: HF_TOKEN (HuggingFace write token)
#
# HF repo structure mirrors ComfyUI model directories:
#   text_encoders/qwen3vl_4b_fp8_scaled.safetensors    (~4GB)
#   vae/qwen_image_vae.safetensors                      (~200MB)
#   diffusion_models/Moody-Krea-Mix-v3G_00001__int8_tensorwise.safetensors (~13.5GB)
# =============================================================================

name: Sync Models to HuggingFace

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-models.yml'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check free disk space
        run: df -h /

      - name: Install huggingface-cli
        run: pip install "huggingface-hub[cli]>=0.26"

      - name: Login to HuggingFace
        run: huggingface-cli login --token "${{ secrets.HF_TOKEN }}"

      # ------------------------------------------------------------------
      # Text Encoder: Qwen3-VL 4B fp8 (~4GB)
      # ------------------------------------------------------------------
      - name: Download text encoder
        run: |
          mkdir -p uploads/text_encoders
          wget -q --show-progress \
            -O uploads/text_encoders/qwen3vl_4b_fp8_scaled.safetensors \
            "https://huggingface.co/Comfy-Org/Qwen3-VL/resolve/main/text_encoders/qwen3vl_4b_fp8_scaled.safetensors"

      - name: Upload text encoder
        run: |
          huggingface-cli upload manyuanrong/kera2-models \
            uploads/text_encoders/qwen3vl_4b_fp8_scaled.safetensors \
            text_encoders/qwen3vl_4b_fp8_scaled.safetensors \
            --repo-type model

      - name: Cleanup text encoder
        run: rm -rf uploads/text_encoders

      # ------------------------------------------------------------------
      # VAE: Qwen Image VAE (~200MB)
      # ------------------------------------------------------------------
      - name: Download VAE
        run: |
          mkdir -p uploads/vae
          wget -q --show-progress \
            -O uploads/vae/qwen_image_vae.safetensors \
            "https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/vae/qwen_image_vae.safetensors"

      - name: Upload VAE
        run: |
          huggingface-cli upload manyuanrong/kera2-models \
            uploads/vae/qwen_image_vae.safetensors \
            vae/qwen_image_vae.safetensors \
            --repo-type model

      - name: Cleanup VAE
        run: rm -rf uploads/vae

      # ------------------------------------------------------------------
      # Main Model: moody-krea-mix int8 (~13.5GB)
      # ------------------------------------------------------------------
      - name: Download main model
        run: |
          mkdir -p uploads/diffusion_models
          wget -q --show-progress \
            -O uploads/diffusion_models/Moody-Krea-Mix-v3G_00001__int8_tensorwise.safetensors \
            "https://huggingface.co/catlover1937/moody-krea-mix/resolve/main/Moody-Krea-Mix-v3G_00001__int8_tensorwise.safetensors"

      - name: Check disk before upload
        run: df -h /

      - name: Upload main model
        run: |
          huggingface-cli upload manyuanrong/kera2-models \
            uploads/diffusion_models/Moody-Krea-Mix-v3G_00001__int8_tensorwise.safetensors \
            diffusion_models/Moody-Krea-Mix-v3G_00001__int8_tensorwise.safetensors \
            --repo-type model

      - name: Final disk check
        run: df -h /
